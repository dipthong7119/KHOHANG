version: "3.3"

services:
  db:
    image: mysql:8.0
    container_name: kho_db
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - db_data:/var/lib/mysql

  app:
    build: .
    container_name: kho_app
    restart: unless-stopped
    environment:
      MYSQL_HOST: db
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    depends_on:
      - db

  nginx:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    container_name: kho_nginx
    restart: unless-stopped
    ports:
      - "8088:8080"
      - "8448:8443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./app/public:/var/www/html:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - app

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: kho_prometheus
    restart: unless-stopped
    ports:
      - "9091:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
 
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: kho_cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
  
  mysqld-exporter:
    image: prom/mysqld-exporter:v0.17.2
    container_name: kho_mysql_exporter
    restart: unless-stopped
    command:
      - --mysqld.address=db:3306
      - --mysqld.username=metrics
    environment:
      MYSQLD_EXPORTER_PASSWORD: "${MYSQL_EXPORTER_PASSWORD}"
    depends_on:
      - db
  grafana:
    image: grafana/grafana:13.1.0
    container_name: kho_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
  loki:
    image: grafana/loki:3.7.8
    container_name: kho_loki
    user: "0:0"
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - ./loki_data:/tmp/loki
    expose:
      - "3100"

  promtail:
    image: grafana/promtail:3.6.8
    container_name: kho_promtail
    user: "0:0"
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - promtail_positions:/tmp
    depends_on:
      - loki

volumes:
  db_data:
  prometheus_data:
  grafana_data:
  loki_data:
  promtail_positions:
